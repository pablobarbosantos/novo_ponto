# Configuração central do pipeline — ver ESPEC_CLAUDE_CODE.md §4

municipio:
  nome: "Uberlândia"
  uf: "MG"
  codigo_ibge: "3170206"

crs:
  geografico: "EPSG:4674"     # SIRGAS 2000 — CRS de origem dos dados IBGE
  metrico: "EPSG:31982"       # SIRGAS 2000 / UTM 22S — validar contra a extensão do município

negocio:
  teto_aluguel: 4000
  limite_aluguel_com_carencia: 5000
  custo_fixo_extra_mensal: 1500
  margem_por_saco_premium: 35        # PROVISÓRIO — substituir pelos dados dos representantes
  taxa_posse_pet_domicilio: 0.55     # PROVISÓRIO — ajustar com fonte Abinpet/IBGE
  gasto_medio_mensal_por_pet: 120    # PROVISÓRIO — ajustar
  captura_min: 0.05
  captura_max: 0.15
  multiplo_minimo_breakeven: 2.5
  # C4.2 (CORRECOES_2.md) — raio de entrega viável, separado da captação que decide o
  # ponto (C4.1). custo_hora_entregador é PROVISÓRIO — sem fonte calibrada no pipeline
  # (nenhum dado de custo real de entregador/motoboy disponível); aproximado por um valor
  # de mercado de entrega em cidade de porte médio, ajustar com dado real antes de decidir
  # ticket mínimo de frete grátis.
  custo_hora_entregador: 18          # PROVISÓRIO — substituir por dado real de custo de entregador
  raio_entrega_max_min: 25           # tempo porta-a-porta máximo aceitável
  fator_ida_volta_entrega: 2.5       # ida + volta + fricção, sobre o tempo de deslocamento puro
  friccao_entrega_min: 6             # minutos fixos: portaria, interfone, espera, elevador

isocronas:
  minutos: [5, 10, 15]
  modo: "driving-car"

# C4.1 (CORRECOES_2.md) — captação de balcão usa só os anéis 5/10min (15min sai
# inteiramente do cálculo de demanda; continua valendo pra forca_concorrencia e C4.2).
# Os pesos (1,00 / 0,25) ficam como constante PESO_CAPTACAO_BALCAO em f7_score.py,
# espelhando o precedente de PESO_ANEL do B1 — aqui só documenta/valida a consistência
# com isocronas.minutos.
captacao_balcao:
  anel_primario_min: 5
  anel_secundario_min: 10
  descartar_acima_de_min: 10

concorrencia:
  # C5 (CORRECOES_2.md) — era 1500m; permissivo demais para concorrente que trabalha a
  # mesma faixa de produto com escala de compra muito maior (candidato de Centro passou
  # com 1709m de distância de rede antes desta correção).
  raio_bloqueio_rede_m: 3000
  peso_rede: 3.0
  peso_independente: 1.0
  # C5 — elimina candidatos no quartil superior de força de concorrência (filtro duro,
  # não só penalidade). É o parâmetro que barra Santa Mônica automaticamente, sem
  # precisar de conhecimento local (C2).
  percentil_maximo_forca: 0.70

# C1 (CORRECOES_2.md) — eixo "vitalidade comercial": o modelo original mede quem mora
# (IBGE) e quem concorre (Places/OSM) no bairro, não se o comércio ali está vivo.
vitalidade_comercial:
  peso_eixo: 0.15                    # C1.4 — retirado proporcionalmente de demanda_estimada e saturacao
  cnae_divisao: "47"                 # C1.1 — "comércio varejista em geral", mais amplo que só pet
  janela_mortalidade_meses: 36
  percentil_filtro_mortalidade: 0.75 # C1.4 — quartil superior é ELIMINADO, não só penalizado
  raio_entorno_concorrentes_m: 1500  # C1.2 — raio pra contar CLOSED_PERMANENTLY por bairro

# C3 (CORRECOES_2.md) — desconta o fator de verticalização quando há suspeita de moradia
# estudantil (perto de campus + alta proporção de 18-24 anos): apartamento de estudante
# não é domicílio com pet nem comprador de ração premium.
estudantil:
  percentil_pct_18a24: 0.75    # sobre os 300 candidatos (universo que decide o score)
  distancia_campus_km: 2.0
  fator_desconto_verticalizacao: 0.6

candidatos:
  espacamento_via_m: 400
  buffer_score_preliminar_m: 1500
  top_n_preliminar: 300
  # PROVISÓRIO — o plano de negócio (PLANO_ESCOLHA_DO_PONTO.md, Camada 4) recomenda "~2 salários
  # mínimos" como piso de renda do responsável, mas não há SM oficial vigente nas fontes que o
  # pipeline consome; aproximado em R$, ajustar com o valor oficial do salário mínimo do ano corrente.
  renda_minima_responsavel: 2000
  # A4 (CORRECOES_3.md) — piso de sanidade de DENSIDADE, não de renda: o piso de renda acima
  # barra o extremo pobre, mas nada barrava um ponto isolado em área cara-e-vazia (ex.: zona
  # empresarial de alta renda e poucos domicílios). Abaixo disso, a área no buffer de 1,5km
  # não sustenta loja de rua. Escolhido abaixo do total de domicílios de Granja Marileusa no
  # buffer (o bairro que motivou o A4 tem renda alta mas poucos domicílios no próprio setor —
  # o buffer de 1,5km alcança vizinhança além dele, então não é descartado por este piso).
  domicilios_minimos_buffer_1500m: 2500

# C2 (CORRECOES_2.md) — conhecimento de quem opera na cidade há anos é dado, não palpite,
# mas precisa ficar declarado e auditável, nunca embutido no código. Aplicado depois do
# score, antes do corte do Top10 (f7_score.py); toda exclusão/penalização aparece numa
# seção própria do relatório com o motivo declarado.
conhecimento_local:
  bairros_excluidos:
    - nome: "Centro"
      motivo: "comércio de rua em decadência; fluxo diurno de passagem, não residencial; estacionamento difícil"
    - nome: "Presidente Roosevelt"
      motivo: "região onde comércio fecha; remanescentes com desempenho fraco"
  bairros_penalizados:
    - nome: "Santa Mônica"
      fator: 0.5
      motivo: "uma das maiores concentrações de concorrência do setor na cidade; proximidade de Petz e Cobasi; alta presença de moradia estudantil (UFU) infla % apartamento sem demanda pet correspondente"

redes_conhecidas:
  - {nome: "Petz Rondon Pacheco", endereco: "Av. Rondon Pacheco, 505"}
  - {nome: "Petz Center Shopping", endereco: "Av. João Naves de Ávila, 1331"}
  - {nome: "Cobasi Rondon Pacheco", endereco: "Av. Rondon Pacheco, 1001"}
